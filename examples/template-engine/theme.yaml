# The showcase theme of the template-engine engine. Registered by `register()`, so
# a deck selects it with `theme: template-engine`.
name: template-engine
extends: dark
engine:
  name: template-engine
  cool: "#8fb2ff"
countdown: none
colors:
  background: "#0c0c10"
  accent: "#ff6a3d"
  secondary: "#f5b84a"
