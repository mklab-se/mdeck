[package]
name = "mdeck"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A markdown-based presentation tool"
readme = "../../README.md"
keywords = ["markdown", "presentation", "slides"]
categories = ["command-line-utilities"]

[lib]
name = "mdeck"
path = "src/lib.rs"

[[bin]]
name = "mdeck"
path = "src/main.rs"

[dependencies]
# The extension interfaces the built-ins register through (EXT-06).
# `unstable-egui`: built-in visuals still draw with egui (a 2.0 deferral).
mdeck-sdk = { workspace = true, features = ["unstable-egui"] }
eframe.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_norway.workspace = true
serde_json.workspace = true
anyhow.workspace = true
colored.workspace = true
inquire.workspace = true
dirs.workspace = true
regex.workspace = true
image.workspace = true
syntect.workspace = true
skrifa.workspace = true
resvg.workspace = true
base64.workspace = true
rayon.workspace = true
notify-debouncer-mini.workspace = true
ailloy.workspace = true
futures.workspace = true
tokio.workspace = true
pdf-extract.workspace = true
zip.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
pdf-writer.workspace = true
flate2.workspace = true

[dev-dependencies]
# EXT-14 end to end: an SDK tutorial engine registered next to the built-ins.
engine-ambience = { path = "../../examples/engine-ambience" }

# Runs on the main thread (no test harness): export opens a window.
[[test]]
name = "extension_engine"
harness = false

[features]
default = [
    "particles",
    "led",
    "splitflap",
    "blocks",
    "line",
    "sketch",
    "watercolour",
    "darkroom",
    "thermal",
]
# The particles engine: the particle field, editorial layouts, stories and the
# built-in point cloud illustrations.
particles = []
# The LED engine: a wall of RGB LEDs that light up illustrations, and the
# `marquee` theme.
led = []
# The split-flap engine: every slide on a departure board, and the
# `departures` theme.
splitflap = []
# The blocks engine: pictures built from falling blocks, and the `stack` theme.
blocks = []
# What the art engines share (`engines::art`): not an engine of its own, on
# with any of them.
art = []
# The line engine: generated line art inked onto a blue drawing sheet or drawn
# in chalk on a slate, and the `blueprint` and `chalkboard` themes.
line = ["art"]
# The sketch engine: generated graphite drawings drawn in with a pencil on a
# sketchbook page, and the `sketchbook` theme.
sketch = ["art"]
# The watercolour engine: generated paintings that bloom onto cold-press
# paper, and the `watercolour` theme.
watercolour = ["art"]
# The darkroom engine: generated photographs that develop under a red
# safelight, and the `darkroom` theme.
darkroom = ["art"]
# The thermal engine: a heat field under the slides, headings that form in
# heat (the cold opening), heat signatures and a heat-trace pen, and the
# `thermal` theme.
thermal = []

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mdeck-v{ version }-{ target }.{ archive-format }"
bin-dir = "mdeck{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
