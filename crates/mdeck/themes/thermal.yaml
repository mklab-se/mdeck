# Thermal: the deck seen through a thermal instrument. Cold indigo-black,
# white-hot headings, iron orange as the accent, and the thermal engine's
# heat field under the slides (headings form in heat on title and section
# slides). Pairs with `@thermal` blocks for thermal images.
name: Thermal
extends: ember
engine: thermal
countdown: burst
colors:
  background: "#05030d"
  text: "#cfc6de"
  heading: "#fff4dc"
  muted: "#8a7aa8"
  rule: "#1d0b4f"
  accent: "#f37a0c"
  accent-soft: "#fde35a"
  secondary: "#a3176f"
  code-background: "#0d0820"
  code-text: "#e6def2"
  series:                    # hot to cold, then two cool tones
    - "#fde35a"
    - "#fbb41c"
    - "#f37a0c"
    - "#d93a2b"
    - "#a3176f"
    - "#57108c"
    - "#2f63d8"
    - "#13a5c9"
particles:
  light: "#fff1c4"
  cool: "#7a3fd0"
annotations:
  pen: "#fde35a"
  pen-outline: "#57108c"
  arrow: "#f37a0c"
  arrow-outline: "#57108c"
heat:
  palette: iron
  drift: false
