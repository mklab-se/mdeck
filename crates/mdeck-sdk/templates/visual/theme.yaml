# A theme to show the @{{name}} visual in. Registered by `register()`, so a
# deck selects it with `theme: {{name}}`. A visual works with every theme:
# it takes its colours from the theme's tokens.
name: {{name}}
extends: dark
colors:
  accent: "#4cc9f0"
  series:
    - "#4cc9f0"
    - "#f72585"
    - "#b5e48c"
    - "#ffb703"
    - "#9d4edd"
    - "#ff8fab"
    - "#90e0ef"
    - "#e9c46a"
