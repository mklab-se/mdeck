[workspace]
resolver = "2"
members = [
    "crates/mdeck",
    "crates/mdeck-sdk",
    # SDK tutorial engines and the instantiated scaffold templates (EXT-15, EXT-30)
    "examples/engine-ambience",
    "examples/engine-pictures",
    "examples/engine-reactive",
    "examples/engine-aurora",
    "examples/template-engine",
    "examples/template-visual",
    "examples/template-design-set",
    "examples/template-transition",
]

[workspace.package]
version = "2.0.1"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/mdeck"
rust-version = "1.95"

[workspace.dependencies]
# The SDK, released in lockstep with mdeck.
mdeck-sdk = { path = "crates/mdeck-sdk", version = "=2.0.1" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }
# mdeck-sdk draws through egui privately. These track the versions eframe uses,
# so one copy of each is built.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.36", default-features = false }
glow = "0.17"
# Golden images in mdeck_sdk::testing. Tracks the png version `image` uses.
png = "0.18"

# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# YAML: serde_norway, the maintained fork of the archived serde_yaml
serde_norway = "0.9"

# Error handling
anyhow = "1.0"

# Terminal
colored = "3.1"
inquire = "0.9"

# Regex
regex = "1.13"

# Image loading
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Theme font validation. Stays on the skrifa version egui's epaint uses, so a
# theme font is checked by the same parser that will load it (and one copy is built).
skrifa = "0.44"

# Logos: SVG files are rasterised with resvg (no text or embedded raster
# support needed: logos are paths)
resvg = { version = "0.48", default-features = false }

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "regex-onig"] }

# Directories
dirs = "7.0"

# HTTP client (for AI icon generation)
ureq = { version = "3.4", features = ["json"] }

# JSON serialization
serde_json = "1.0"

# Base64 encoding/decoding
base64 = "0.23"

# Parallelism
rayon = "1.12"

# File watching
notify-debouncer-mini = "0.7"

# AI integration
ailloy = { version = "2.2.1", default-features = false, features = ["config-tui"] }
futures = "0.3"
tokio = { version = "1.53", features = ["rt", "macros"] }

# Document extraction (for ai create)
pdf-extract = "0.12"
zip = "8.6"
# Spike (#11): LaTeX math layout. RaTeX returns a positioned display list we paint with epaint.
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
# PDF export (#10): one image page per slide.
pdf-writer = "0.15"
flate2 = "1.1"
# The connected displays, for placing the presenter window and `M`.
display-info = "0.5"
