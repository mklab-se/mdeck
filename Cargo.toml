[workspace]
resolver = "2"
members = [
    "crates/mdeck",
]

[workspace.package]
version = "1.3.1"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/mdeck"
rust-version = "1.95"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11"] }

# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"

# Terminal
colored = "3.1"
inquire = "0.9"

# Regex
regex = "1.13"

# Image loading
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# Directories
dirs = "7.0"

# HTTP client (for AI icon generation)
ureq = { version = "3.4", features = ["json"] }

# JSON serialization
serde_json = "1.0"

# Base64 encoding/decoding
base64 = "0.23"

# Parallelism
rayon = "1.12"

# File watching
notify-debouncer-mini = "0.7"

# AI integration
ailloy = { version = "2.2", default-features = false, features = ["config-tui"] }
futures = "0.3"
tokio = { version = "1.53", features = ["rt", "macros"] }

# Document extraction (for ai create)
pdf-extract = "0.12"
zip = "8.6"
